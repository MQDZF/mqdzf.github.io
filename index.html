<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家族关系</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
    background: #000;
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    user-select: none;
  }

  /* Header */
  .app-header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    padding: 12px 20px 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }
  .app-header h1 {
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.41px;
  }
  .app-header p {
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    text-align: center;
    margin-top: 2px;
    letter-spacing: 0;
  }

  /* Toolbar */
  .toolbar {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    gap: 6px;
    background: rgba(28,28,30,0.8);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 4px 8px;
    border: 0.5px solid rgba(255,255,255,0.1);
  }
  .tool-btn {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.6);
    font-size: 12px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }
  .tool-btn.active {
    background: rgba(255,255,255,0.15);
    color: #fff;
  }
  .tool-btn:hover:not(.active) { color: #fff; }

  /* Canvas */
  #family-canvas {
    position: fixed;
    inset: 0;
    cursor: grab;
  }
  #family-canvas:active { cursor: grabbing; }

  /* Bottom hint */
  .bottom-hint {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(28,28,30,0.75);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    z-index: 100;
    border: 0.5px solid rgba(255,255,255,0.1);
    text-align: center;
  }

  /* Node Tooltip */
  .node-tooltip {
    position: fixed;
    z-index: 200;
    background: rgba(28,28,30,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    padding: 0;
    min-width: 200px;
    overflow: hidden;
    border: 0.5px solid rgba(255,255,255,0.12);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
    pointer-events: none;
    opacity: 0;
    transform: translateY(4px) scale(0.96);
    transition: opacity 0.2s, transform 0.2s;
  }
  .node-tooltip.show {
    opacity: 1;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }
  .tooltip-hero {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px;
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
  }
  .tooltip-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }
  .tooltip-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .tooltip-name { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.41px; }
  .tooltip-role { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .tooltip-deceased { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 3px; }
  .tooltip-info {
    padding: 10px 16px;
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    border-bottom: 0.5px solid rgba(255,255,255,0.08);
    line-height: 1.6;
  }
  .tooltip-relations {
    padding: 8px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .tooltip-rel-chip {
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 3px 10px;
    font-size: 11px;
    color: rgba(255,255,255,0.65);
    cursor: pointer;
    transition: background 0.15s;
    border: 0.5px solid rgba(255,255,255,0.06);
  }
  .tooltip-rel-chip:hover { background: rgba(255,255,255,0.18); }
  .tooltip-actions {
    padding: 8px 16px 14px;
    display: flex;
    gap: 8px;
  }
  .tooltip-btn {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 9px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.15s;
  }
  .tooltip-btn:active { opacity: 0.7; }
  .tooltip-btn.primary { background: #ff3b30; color: #fff; }
  .tooltip-btn.secondary { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.8); }

  /* Detail Sheet */
  .sheet-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 300;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.2s ease;
  }
  .sheet-overlay.active { display: flex; }
  .sheet-overlay.active > * { pointer-events: auto; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .detail-sheet {
    background: #1c1c1e;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 560px;
    height: 92vh;
    max-height: 92vh;
    overflow-y: auto;
    animation: slideUp 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    color: #fff;
    pointer-events: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet-handle {
    width: 36px; height: 5px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    margin: 8px auto 0;
  }
  .sheet-header { padding: 16px 20px 12px; text-align: center; }
  .sheet-title { font-size: 22px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
  .sheet-subtitle { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 4px; }
  .sheet-deceased { font-size: 12px; color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.06); border-radius: 10px; padding: 3px 10px; display: inline-block; margin-top: 6px; }
  .profile-hero { display: flex; flex-direction: column; align-items: center; padding: 20px 20px 24px; }
  .profile-avatar-wrap { position: relative; cursor: pointer; }
  .profile-avatar {
    width: 90px; height: 90px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; font-weight: 600; color: #fff;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .profile-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .profile-avatar-ring {
    position: absolute; inset: -3px; border-radius: 50%;
    border: 2px dashed rgba(255,255,255,0.25);
  }
  .profile-avatar.deceased { filter: grayscale(40%); opacity: 0.8; }
  .profile-name { font-size: 22px; font-weight: 700; color: #fff; margin-top: 12px; letter-spacing: -0.5px; }
  .profile-role { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 4px; }
  .view-tabs { display: flex; background: rgba(255,255,255,0.06); border-radius: 10px; padding: 2px; margin: 0 20px 16px; }
  .tab-btn { flex: 1; border: none; background: transparent; border-radius: 8px; padding: 8px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.5); cursor: pointer; font-family: inherit; transition: all 0.2s; }
  .tab-btn.active { background: #2c2c2e; color: #fff; }
  .info-section { padding: 0 20px 16px; }
  .info-section-title { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
  .info-card { background: rgba(255,255,255,0.05); border-radius: 12px; overflow: hidden; }
  .info-row { display: flex; align-items: flex-start; padding: 11px 16px; border-bottom: 0.5px solid rgba(255,255,255,0.06); }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 13px; color: rgba(255,255,255,0.4); width: 70px; flex-shrink: 0; padding-top: 1px; }
  .info-value { font-size: 13px; color: #fff; font-weight: 500; letter-spacing: -0.24px; }
  .intro-text { font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.65; padding: 12px 16px; letter-spacing: -0.1px; }
  .rel-grid { display: flex; flex-direction: column; gap: 2px; padding: 0 20px 20px; }
  .rel-item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background 0.15s; }
  .rel-item:hover { background: rgba(255,255,255,0.1); }
  .rel-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; color: #fff; flex-shrink: 0; overflow: hidden; }
  .rel-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  .rel-name { font-size: 14px; font-weight: 600; color: #fff; }
  .rel-rel { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 1px; }
  .rel-arrow { margin-left: auto; color: rgba(255,255,255,0.2); font-size: 18px; }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 20px 20px; }
  .action-btn { background: rgba(255,255,255,0.08); border: none; border-radius: 12px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; transition: background 0.15s; font-family: inherit; }
  .action-btn:hover { background: rgba(255,255,255,0.14); }
  .action-btn:active { background: rgba(255,255,255,0.05); }
  .action-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .action-label { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.8); }
  .sheet-footer { padding: 4px 20px 24px; display: flex; gap: 10px; pointer-events: auto; }
  .sheet-btn { flex: 1; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; transition: opacity 0.15s; pointer-events: auto; }
  .sheet-btn:active { opacity: 0.8; }
  .sheet-btn.close-btn { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); pointer-events: auto; }

  .bottom-safe { height: 34px; }

  /* Network View in Sheet */
  .mini-network-wrap { padding: 0 20px 16px; }
  .mini-network-canvas { border-radius: 16px; overflow: hidden; background: #111; }
</style>
</head>

    <button class="tooltip-btn secondary" onclick="hideTooltip()">关闭</button>
  </div>
</div>

<!-- Detail Sheet -->
<div class="sheet-overlay" id="sheetOverlay">

    <div class="view-tabs">

      <button class="tab-btn" id="tab-rel" onclick="switchTab('rel')">家庭关系</button>
    </div>

    <div id="view-info">
      <div class="info-section">
        <div class="info-section-title">基本信息</div>
        <div class="info-card" id="info-card"></div>
      </div>
    </div>

    <div id="view-rel" style="display:none">
      <div class="rel-grid" id="rel-grid"></div>
    </div>

    <div class="action-grid" style="grid-template-columns:1fr;">

        <div class="action-icon" style="background:rgba(255,59,48,0.2); color:#ff3b30;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">

        </div>
        <div class="action-label">查看关系网</div>
      </button>
    </div>

    <div class="sheet-footer">
      <button class="sheet-btn close-btn" onclick="closeDetail()">关闭</button>
    </div>

    <div class="bottom-safe"></div>
  </div>
</div>

function loadData() {
  const s = localStorage.getItem('familyTreeData3');
  if (s) {
    const d = JSON.parse(s);
    Object.keys(d).forEach(id => {
      if (people[id]) Object.assign(people[id], d[id]);
    });
  }
}

function saveData() {
  const out = {};
  Object.keys(people).forEach(id => {
    out[id] = {
      birth: people[id].birth, hometown: people[id].hometown,
      job: people[id].job, phone: people[id].phone,
      intro: people[id].intro, photo: people[id].photo
    };
  });
  localStorage.setItem('familyTreeData3', JSON.stringify(out));
}

// ===================== CANVAS DRAWING =====================
const canvas = document.getElementById('family-canvas');
const ctx = canvas.getContext('2d');
let nodes = {};
let panX = 0, panY = 0;
let isDragging = false, lastMX = 0, lastMY = 0;
let hoveredNode = null;
let currentView = 'network';

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  drawAll();
}

function getNodeScreenPos(id) {
  const layout = NODE_LAYOUT[id];
  if (!layout) return null;
  return {
    x: layout.x * canvas.width + panX,
    y: layout.y * canvas.height + panY + 60, // offset for header
    w: 58,
    h: 58
  };
}

function drawAll() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawConnections();
  drawNodes();
}

function drawConnections() {
  // Draw all relationship lines
  const relColors = {
    parent: '#ff3b30', child: '#0a84ff', sibling: '#34c759',
    spouse: 'rgba(255,255,255,0.35)', cousin: '#af52de',
    uncle: '#ff9f0a', uncleSpouse: '#ff9f0a',
    grandparent: 'rgba(255,255,255,0.25)', parentInLaw: '#ff9f0a',
    cousinInLaw: '#af52de'
  };

  const drawn = new Set();
  Object.keys(people).forEach(id => {
    const p = people[id];
    (p.relations || []).forEach(r => {
      const key = [id, r.id].sort().join('-');
      if (drawn.has(key) || !NODE_LAYOUT[r.id]) return;
      drawn.add(key);

      const from = getNodeScreenPos(id);
      const to = getNodeScreenPos(r.id);
      if (!from || !to) return;

      const color = relColors[r.relType] || 'rgba(255,255,255,0.2)';
      const dash = r.relType === 'spouse' ? [6, 4] : [];
      const lineW = r.relType === 'spouse' ? 1.2 : 1.0;

      ctx.save();
      ctx.strokeStyle = color;
      ctx.lineWidth = lineW;
      ctx.setLineDash(dash);
      ctx.globalAlpha = 0.45;
      ctx.beginPath();
      ctx.moveTo(from.x, from.y + 29);
      ctx.lineTo(to.x, to.y + 29);
      ctx.stroke();
      ctx.restore();
    });
  });
}

function drawNodes() {
  Object.keys(NODE_LAYOUT).forEach(id => {
    const p = people[id];
    const pos = getNodeScreenPos(id);
    if (!pos) return;
    const { x, y, w } = pos;
    const r = w / 2;
    const isHovered = hoveredNode === id;
    const isSelf = id === 'zhangke';

    // Glow for self
    if (isSelf) {
      const grd = ctx.createRadialGradient(x, y + r, r, x, y + r, r * 1.8);
      grd.addColorStop(0, 'rgba(255,59,48,0.25)');
      grd.addColorStop(1, 'rgba(255,59,48,0)');
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(x, y + r, r * 1.8, 0, Math.PI * 2);
      ctx.fill();
    }

    // Circle bg
    ctx.save();
    if (p.deceased) ctx.globalAlpha = 0.65;
    if (isHovered) {
      ctx.shadowColor = p.avatarColor;
      ctx.shadowBlur = 20;
    }
    ctx.beginPath();
    ctx.arc(x, y + r, isHovered ? r + 2 : r, 0, Math.PI * 2);
    ctx.fillStyle = p.avatarColor;
    ctx.fill();
    ctx.restore();

    // Avatar char or image
    if (p.photo) {
      const img = new Image();
      img.src = p.photo;
      if (img.complete) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y + r, r, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, x - r, y, w, w);
        ctx.restore();
      } else {
        drawAvatarChar(ctx, x, y + r, r, p.avatarChar);
      }
    } else {
      drawAvatarChar(ctx, x, y + r, r, p.avatarChar);
    }

    // Self ring
    if (isSelf) {
      ctx.save();
      ctx.strokeStyle = '#FFD700';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, y + r, r + 1.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Name
    const nameY = y + w + 14;
    ctx.fillStyle = isSelf ? '#fff' : 'rgba(255,255,255,0.85)';
    ctx.font = `${isSelf ? '700' : '600'} 11px -apple-system, BlinkMacSystemFont, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.name, x, nameY);

    // Role
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '10px -apple-system, BlinkMacSystemFont, sans-serif';
    const roleText = p.deceased ? p.role + ' · 已故' : p.role;
    ctx.fillText(roleText, x, nameY + 13);
  });
}

function drawAvatarChar(ctx, x, y, r, char) {
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = `600 ${r * 0.55}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(char, x, y);
}

// ===================== INTERACTION =====================
function getNodeAt(mx, my) {
  const headerH = 60;
  Object.keys(NODE_LAYOUT).forEach(id => {
    const pos = getNodeScreenPos(id);
    if (!pos) return;
    const { x, y, w } = pos;
    if (mx >= x && mx <= x + w && my >= y && my <= y + w) {
      hoveredNode = id;
    }
  });
  return hoveredNode;
}

canvas.addEventListener('mousemove', e => {
  if (isDragging) {
    panX += e.clientX - lastMX;
    panY += e.clientY - lastMY;
    lastMX = e.clientX;
    lastMY = e.clientY;
    drawAll();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const prev = hoveredNode;
  hoveredNode = null;
  getNodeAt(mx, my);
  if (hoveredNode !== prev) {
    canvas.style.cursor = hoveredNode ? 'pointer' : 'grab';
    drawAll();
  }
  // Tooltip
  if (hoveredNode) {
    showTooltip(hoveredNode, e.clientX, e.clientY);
  } else {
    hideTooltip();
  }
});

canvas.addEventListener('mousedown', e => {
  isDragging = false;
  lastMX = e.clientX;
  lastMY = e.clientY;
});

canvas.addEventListener('mouseup', e => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const moved = Math.abs(mx - lastMX) + Math.abs(my - lastMY);
  if (moved < 5 && hoveredNode) {
    openDetail(hoveredNode);
    hideTooltip();
  }
});

canvas.addEventListener('mouseleave', () => {
  hoveredNode = null;
  hideTooltip();
  drawAll();
});

// Touch support
canvas.addEventListener('touchstart', e => {
  const touch = e.touches[0];
  lastMX = touch.clientX;
  lastMY = touch.clientY;
  isDragging = false;
});

canvas.addEventListener('touchmove', e => {
  const touch = e.touches[0];
  const moved = Math.abs(touch.clientX - lastMX) + Math.abs(touch.clientY - lastMY);
  if (moved > 8) isDragging = true;
  if (isDragging) {
    panX += touch.clientX - lastMX;
    panY += touch.clientY - lastMY;
    lastMX = touch.clientX;
    lastMY = touch.clientY;
    drawAll();
    e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  if (!isDragging && e.changedTouches.length > 0) {
    const touch = e.changedTouches[0];
    const rect = canvas.getBoundingClientRect();
    const mx = touch.clientX - rect.left;
    const my = touch.clientY - rect.top;
    const prev = hoveredNode;
    hoveredNode = null;
    getNodeAt(mx, my);
    if (hoveredNode) openDetail(hoveredNode);
  }
  isDragging = false;
});

  document.getElementById('tt-char').textContent = p.avatarChar;

    imgEl.src = p.photo;
    imgEl.style.display = 'block';

    document.getElementById('tt-char').style.justifyContent = 'center';
    document.getElementById('tt-char').style.width = '100%';
    document.getElementById('tt-char').style.height = '100%';
  }

  document.getElementById('tt-name').textContent = p.name;
  document.getElementById('tt-role').textContent = p.role;
  document.getElementById('tt-deceased').textContent = p.deceased ? '已离世' : '';

  const infoEl = document.getElementById('tt-info');
  const info = [p.birth, p.hometown, p.job, p.phone].filter(Boolean).join(' · ');
  infoEl.textContent = info || '暂无更多信息';

  const relContainer = document.getElementById('tt-relations');
  relContainer.innerHTML = '';
  (p.relations || []).slice(0, 6).forEach(r => {
    const chip = document.createElement('div');
    chip.className = 'tooltip-rel-chip';
    chip.textContent = `${r.name}（${r.rel}）`;
    chip.onclick = e => { e.stopPropagation(); openDetail(r.id); hideTooltip(); };
    relContainer.appendChild(chip);
  });

  // Position
  const TW = 220, TH = tooltip.offsetHeight || 260;
  let tx = cx + 14;
  let ty = cy - TH / 2;
  if (tx + TW > window.innerWidth - 10) tx = cx - TW - 14;
  if (ty < 80) ty = 80;
  if (ty + TH > window.innerHeight - 20) ty = window.innerHeight - TH - 20;

  tooltip.style.left = tx + 'px';
  tooltip.style.top = ty + 'px';
  tooltip.classList.add('show');
}

function hideTooltip() {
  tooltip.classList.remove('show');
  tooltipId = null;
}

function openDetailFromTooltip() {
  if (tooltipId) openDetail(tooltipId);
  hideTooltip();
}

  document.getElementById('view-info').style.display = tab === 'info' ? '' : 'none';
  document.getElementById('view-rel').style.display = tab === 'rel' ? '' : 'none';

function renderInfoCard(p) {
  const card = document.getElementById('info-card');
  const fields = [
    { label: '出生年份', value: p.birth },
    { label: '籍贯', value: p.hometown },
    { label: '职业', value: p.job },
    { label: '电话', value: p.phone },
  ];
  let html = '';
  fields.forEach(f => {
    if (f.value) {
      html += `<div class="info-row"><div class="info-label">${f.label}</div><div class="info-value">${f.value}</div></div>`;

  if (p.intro) {
    html += `<div class="intro-text">${p.intro}</div>`;
  }
  if (!html) {
    html = '<div class="intro-text" style="color:rgba(255,255,255,0.3);text-align:center;padding:16px;">点击下方「编辑」添加内容</div>';
  }
  card.innerHTML = html;
}

function renderRelGrid(p) {
  const grid = document.getElementById('rel-grid');
  grid.innerHTML = '';
  (p.relations || []).forEach(r => {
    const rp = people[r.id];
    if (!rp) return;
    const item = document.createElement('div');
    item.className = 'rel-item';
    item.onclick = () => { closeDetail(); setTimeout(() => openDetail(r.id), 300); };
    item.innerHTML = `
      <div class="rel-avatar" style="background:${rp.avatarColor}" data-id="${r.id}">

        <div class="rel-name">${r.name}</div>

      item.querySelector('.rel-avatar').innerHTML = `<img src="${rp.photo}">`;

function handleSheetPhoto(e) {
  const file = e.target.files[0];
  if (!file || !currentId) return;
  const reader = new FileReader();
  reader.onload = ev => {
    people[currentId].photo = ev.target.result;

function drawMiniNetwork(centerId) {
  const canvas2 = document.getElementById('mini-canvas');
  if (!canvas2) return;
  const W = canvas2.width;
  const H = canvas2.height;
  const ctx2 = canvas2.getContext('2d');
  ctx2.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;
  const R = Math.min(W, H) * 0.32;

  const center = people[centerId];
  const rels = center.relations || [];
  const relTypeMap = {};
  rels.forEach(r => { relTypeMap[r.id] = r.relType; });

  const lineColors = {
    parent: '#ff3b30', child: '#0a84ff', sibling: '#34c759',
    spouse: 'rgba(255,255,255,0.5)', cousin: '#af52de',
    uncle: '#ff9f0a', uncleSpouse: '#ff9f0a',
    grandparent: 'rgba(255,255,255,0.3)', parentInLaw: '#ff9f0a',
    cousinInLaw: '#af52de'
  };

  const nodes2 = [];

  // Spouse
  rels.filter(r => r.relType === 'spouse').forEach(r => {
    const pp = people[r.id];
    if (!pp) return;
    nodes2.push({ id: r.id, name: r.name, rel: r.rel, relType: r.relType, x: cx - R * 0.7, y: cy, color: pp.avatarColor, char: pp.avatarChar, photo: pp.photo, deceased: pp.deceased });
  });

  // Parents (top)
  rels.filter(r => r.relType === 'parent').forEach((r, i, arr) => {
    const pp = people[r.id];
    if (!pp) return;
    const spread = Math.min(arr.length, 3) * 0.45;
    const startA = -Math.PI / 2 - spread / 2;
    const idx = arr.indexOf(r);
    const angle = startA + idx * (spread / Math.max(arr.length - 1, 1));
    nodes2.push({ id: r.id, name: r.name, rel: r.rel, relType: r.relType, x: cx + Math.cos(angle) * R, y: cy + Math.sin(angle) * R, color: pp.avatarColor, char: pp.avatarChar, photo: pp.photo, deceased: pp.deceased });
  });

  // Children
  rels.filter(r => ['child', 'sibling', 'cousin', 'uncle', 'uncleSpouse', 'parentInLaw', 'cousinInLaw'].includes(r.relType)).forEach((r, i, arr) => {
    const pp = people[r.id];
    if (!pp) return;
    const spread = Math.min(arr.length, 4) * 0.5;
    const startA = Math.PI / 2 - spread / 2;
    const idx = arr.indexOf(r);
    const angle = startA + idx * (spread / Math.max(arr.length - 1, 1));
    nodes2.push({ id: r.id, name: r.name, rel: r.rel, relType: r.relType, x: cx + Math.cos(angle) * R, y: cy + Math.sin(angle) * R, color: pp.avatarColor, char: pp.avatarChar, photo: pp.photo, deceased: pp.deceased });
  });

  // Grandparents (outer)
  rels.filter(r => r.relType === 'grandparent').forEach((r, i, arr) => {
    const pp = people[r.id];
    if (!pp) return;
    const spread = Math.min(arr.length, 3) * 0.7;
    const startA = -Math.PI / 2 - spread / 2;
    const idx = arr.indexOf(r);
    const angle = startA + idx * (spread / Math.max(arr.length - 1, 1));
    nodes2.push({ id: r.id, name: r.name, rel: r.rel, relType: r.relType, x: cx + Math.cos(angle) * R * 1.5, y: cy + Math.sin(angle) * R * 1.5, color: pp.avatarColor, char: pp.avatarChar, photo: pp.photo, deceased: pp.deceased });
  });

  // Draw lines
  nodes2.forEach(n => {
    const color = lineColors[n.relType] || 'rgba(255,255,255,0.2)';
    const dash = n.relType === 'spouse' ? [5, 3] : [];
    ctx2.save();
    ctx2.strokeStyle = color;
    ctx2.lineWidth = n.relType === 'spouse' ? 1.2 : 1.0;
    ctx2.setLineDash(dash);
    ctx2.globalAlpha = 0.5;
    ctx2.beginPath();
    ctx2.moveTo(cx, cy);
    ctx2.lineTo(n.x, n.y);
    ctx2.stroke();
    ctx2.restore();
  });

  // Center node
  const cSize = 44;
  ctx2.save();
  ctx2.shadowColor = center.avatarColor;
  ctx2.shadowBlur = 15;
  ctx2.beginPath();
  ctx2.arc(cx, cy, cSize/2, 0, Math.PI*2);
  ctx2.fillStyle = center.avatarColor;
  ctx2.fill();
  ctx2.restore();
  drawMiniChar(ctx2, cx, cy, cSize/2, center.avatarChar, center.photo);

  // Glow ring
  ctx2.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx2.lineWidth = 2;
  ctx2.setLineDash([3, 2]);
  ctx2.beginPath();
  ctx2.arc(cx, cy, cSize/2 + 3, 0, Math.PI*2);
  ctx2.stroke();
  ctx2.setLineDash([]);

  // Label
  ctx2.fillStyle = '#fff';
  ctx2.font = '600 11px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx2.textAlign = 'center';
  ctx2.fillText(center.name, cx, cy + cSize/2 + 15);

  // Other nodes
  nodes2.forEach(n => {
    const sz = 32;
    ctx2.save();
    if (n.deceased) ctx2.globalAlpha = 0.6;
    ctx2.beginPath();
    ctx2.arc(n.x, n.y, sz/2, 0, Math.PI*2);
    ctx2.fillStyle = n.color;
    ctx2.fill();
    ctx2.restore();
    drawMiniChar(ctx2, n.x, n.y, sz/2, n.char, n.photo);
    ctx2.fillStyle = 'rgba(255,255,255,0.85)';
    ctx2.font = '600 9px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx2.textAlign = 'center';
    ctx2.fillText(n.name, n.x, n.y + sz/2 + 12);
    ctx2.fillStyle = 'rgba(255,255,255,0.35)';
    ctx2.font = '9px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx2.fillText(n.rel, n.x, n.y + sz/2 + 22);
  });

  // Click handling (only on canvas area)
  canvas2.addEventListener('click', function canvasClickHandler(e) {
    const rect = canvas2.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    for (const n of nodes2) {
      if (Math.abs(mx - n.x) < 20 && Math.abs(my - n.y) < 20) {
        openDetail(n.id);
        return;
      }
    }
  }, { once: true });
}

function drawMiniChar(ctx2, x, y, r, char, photo) {
  if (photo) {
    try {
      const img = new Image();
      img.src = photo;
      if (img.complete) {
        ctx2.save();
        ctx2.beginPath();
        ctx2.arc(x, y, r, 0, Math.PI*2);
        ctx2.clip();
        ctx2.drawImage(img, x - r, y - r, r * 2, r * 2);
        ctx2.restore();
        return;
      }
    } catch(e) {}
  }
  ctx2.fillStyle = 'rgba(255,255,255,0.95)';
  ctx2.font = `600 ${r * 0.6}px -apple-system, BlinkMacSystemFont, sans-serif`;
  ctx2.textAlign = 'center';
  ctx2.textBaseline = 'middle';
  ctx2.fillText(char, x, y);
}

      .list-title { flex:1; text-align:center; font-size:17px; font-weight:700; color:#fff; padding-right:50px; }
      .list-content { padding:20px 16px 80px; max-width:560px; margin:0 auto; }
      .list-section-label { font-size:12px; font-weight:600; color:rgba(255,255,255,0.35); text-transform:uppercase; letter-spacing:0.5px; margin:20px 0 8px 4px; }
      .list-card { background:rgba(255,255,255,0.05); border-radius:12px; padding:14px 16px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:background 0.15s; margin-bottom:2px; }
      .list-card:hover { background:rgba(255,255,255,0.1); }
      .list-avatar { width:46px; height:46px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:17px; font-weight:600; color:#fff; flex-shrink:0; overflow:hidden; position:relative; }
      .list-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; }
      .list-avatar.deceased { opacity:0.65; filter:grayscale(30%); }
      .list-name { font-size:16px; font-weight:600; color:#fff; }
      .list-meta { font-size:13px; color:rgba(255,255,255,0.4); margin-top:2px; }
      .list-arrow { margin-left:auto; color:rgba(255,255,255,0.2); font-size:20px; }
    </style>
    <div class="list-overlay" id="listOverlay">
      <div class="list-header">
        <button class="list-back" onclick="closeListView()">‹ 关系网</button>
        <div class="list-title">家庭成员</div>
      </div>
      <div class="list-content">
        <div class="list-section-label">祖辈</div>
        ${gen1.map(id => listCardHTML(id)).join('')}
        <div class="list-section-label">父辈</div>
        ${gen2.map(id => listCardHTML(id)).join('')}
        <div class="list-section-label">晚辈</div>

      </div>
    </div>
  `;

  document.getElementById('listOverlay').scrollTop = 0;
}

function listCardHTML(id) {
  const p = people[id];
  const isSelf = id === 'zhangke';
  return `
    <div class="list-card" onclick="closeListView();setTimeout(()=>openDetail('${id}'),200)">
      <div class="list-avatar ${p.deceased?'deceased':''}" data-id="${id}" style="background:${p.avatarColor}">
        <span>${p.avatarChar}</span>
      </div>
      <div style="flex:1">
        <div class="list-name">${p.name}${isSelf?' · 本人':''}</div>
        <div class="list-meta">${p.role}${p.deceased?' · 已离世':''}</div>
      </div>
      <div class="list-arrow">›</div>
    </div>
  `;
}

function closeListView() {
  const el = document.getElementById('listOverlay');
  if (el) el.remove();
}

function setView(view) {
  document.getElementById('tool-network').classList.toggle('active', view === 'network');
  document.getElementById('tool-list').classList.toggle('active', view === 'list');
  if (view === 'list') {
    renderListView();
  } else {
    closeListView();
  }
}

  loadData();
  // Save original sheet template for restoration when returning from mini-network/edit views
  originalSheetHTML = document.getElementById('detailSheet').innerHTML;
  resizeCanvas();
});

window.addEventListener('resize', () => {

});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const netView = document.getElementById('networkView');
    if (netView && netView.classList.contains('active')) return;
    if (document.getElementById('sheetOverlay').classList.contains('active')) closeDetail();
    else closeListView();
  }
});
